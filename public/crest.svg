<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-label="Oxford University History Society crest" fill="none">
  <defs>
    <path id="crest-top" d="M 32 110 A 78 78 0 0 1 188 110" />
    <path id="crest-bottom" d="M 36 110 A 74 74 0 0 0 184 110" />
  </defs>

  <!-- rings -->
  <g stroke="#002147">
    <circle cx="110" cy="110" r="96" stroke-width="2.4" />
    <circle cx="110" cy="110" r="90" stroke-width="1.2" />
  </g>

  <!-- ring text -->
  <g fill="#002147" font-family="'Cormorant Garamond', Georgia, serif" font-weight="600">
    <text font-size="15" letter-spacing="2">
      <textPath href="#crest-top" startOffset="50%" text-anchor="middle">OXFORD UNIVERSITY</textPath>
    </text>
    <text font-size="15" letter-spacing="2">
      <textPath href="#crest-bottom" startOffset="50%" text-anchor="middle">HISTORY SOCIETY</textPath>
    </text>
  </g>

  <!-- side ornaments where the two arcs meet -->
  <g fill="#a9822f">
    <path d="M 26 110 l 4 -4 l 4 4 l -4 4 z" />
    <path d="M 186 110 l 4 -4 l 4 4 l -4 4 z" />
  </g>

  <!-- Radcliffe Camera: rotunda + dome -->
  <g stroke="#002147" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <!-- finial -->
    <circle cx="110" cy="58" r="2.2" fill="#002147" stroke="none" />
    <line x1="110" y1="61" x2="110" y2="68" />
    <!-- dome -->
    <path d="M 90 100 Q 110 66 130 100 Z" fill="#f4eede" />
    <path d="M 95 100 Q 110 76 125 100" stroke-width="1.1" fill="none" />
    <!-- lantern base -->
    <rect x="99" y="96" width="22" height="5" fill="#f4eede" />
    <!-- drum with columns -->
    <rect x="84" y="102" width="52" height="34" fill="#f4eede" />
    <line x1="92" y1="104" x2="92" y2="134" stroke-width="1.1" />
    <line x1="100" y1="104" x2="100" y2="134" stroke-width="1.1" />
    <line x1="108" y1="104" x2="108" y2="134" stroke-width="1.1" />
    <line x1="116" y1="104" x2="116" y2="134" stroke-width="1.1" />
    <line x1="124" y1="104" x2="124" y2="134" stroke-width="1.1" />
    <line x1="132" y1="104" x2="132" y2="134" stroke-width="1.1" />
    <!-- entablature / base steps -->
    <rect x="78" y="136" width="64" height="7" fill="#f4eede" />
    <rect x="73" y="143" width="74" height="6" fill="#f4eede" />
    <rect x="68" y="149" width="84" height="5" fill="#f4eede" />
  </g>
</svg>
